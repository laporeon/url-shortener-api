# ====== APPLICATION =====
server:
  port: ${PORT:8080}

spring:
  application:
  name: url-shortener-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
# ====== DATABASE ======
  mongodb:
    auto-index-creation: true
    authentication-database: admin

# ====== SWAGGER ======
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

# ====== LOGGING ======
logging:
  level:
    org:
      mongodb:
        driver: INFO
    com:
      laporeon: INFO

# ====== ACTUATOR ======
management:
  endpoints:
    web:
      exposure:
        include: health

# ====== CORS ======
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
