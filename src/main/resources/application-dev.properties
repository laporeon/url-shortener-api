# ====== ENVIRONMENT =====
spring.config.import=optional:file:.env[.properties]

# ====== DATABASE ======
spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=${MONGO_DATABASE:urlshortenerdb}
spring.mongodb.username=${MONGO_USER}
spring.mongodb.password=${MONGO_PASSWORD}

# ====== LOGGING ======
logging.level.org.springframework.data.mongodb.core=DEBUG
logging.level.org.mongodb.driver=DEBUG
logging.level.com.laporeon=DEBUG

# ====== ACTUATOR ======
management.endpoint.health.show-details=always

# ====== CORS ======
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}